<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4f57"/>
      <stop offset="1" stop-color="#26292e"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
  </defs>
  <!-- shadow -->
  <rect x="8" y="27" width="116" height="80" rx="10" fill="#000" opacity="0.18"/>
  <!-- body -->
  <rect x="6" y="23" width="116" height="80" rx="10" fill="url(#body)"/>
  <rect x="6.5" y="23.5" width="115" height="79" rx="9.5" fill="none" stroke="#fff" stroke-opacity="0.12"/>
  <!-- screen -->
  <rect x="13" y="30" width="102" height="66" rx="5" fill="url(#screen)"/>
  <!-- camera (top bezel, landscape) -->
  <circle cx="64" cy="26.5" r="1.8" fill="#16181b"/>
  <!-- app grid -->
  <g fill="#fff" fill-opacity="0.85">
    <rect x="25" y="40" width="12" height="12" rx="3"/>
    <rect x="43" y="40" width="12" height="12" rx="3"/>
    <rect x="61" y="40" width="12" height="12" rx="3"/>
    <rect x="79" y="40" width="12" height="12" rx="3"/>
    <rect x="25" y="58" width="12" height="12" rx="3"/>
    <rect x="43" y="58" width="12" height="12" rx="3"/>
    <rect x="61" y="58" width="12" height="12" rx="3"/>
  </g>
  <!-- dock + home bar -->
  <rect x="34" y="78" width="60" height="10" rx="5" fill="#fff" fill-opacity="0.25"/>
  <rect x="54" y="91" width="20" height="2" rx="1" fill="#fff" fill-opacity="0.7"/>
</svg>
